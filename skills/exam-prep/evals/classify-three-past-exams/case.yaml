schema_version: "1.1"
name: classify-three-past-exams
expected_outcome: >
  The assistant scans the exam files first, classifies every question of the three exams into the question
  bank (one object per question with topic, type, points, year), notices that the Poisson question of 2022
  and 2023 is identical (dedupe), and replies in Hebrew with a topic table ordered by points share that uses
  frequency language only — never a prediction of what will be on the exam.
