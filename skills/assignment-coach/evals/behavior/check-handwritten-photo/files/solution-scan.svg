<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <rect width="900" height="420" fill="#fbfaf4"/>
  <g font-family="Comic Sans MS, Segoe Print, cursive" font-size="30" fill="#1b2a6b">
    <text x="40" y="60">Q2.  f(x) = x^2 - 6x + 11</text>
    <text x="40" y="120">f'(x) = x - 6</text>
    <text x="40" y="180">f'(x) = 0  =&gt;  x = 6</text>
    <text x="40" y="240">x = 6 is outside [0,5], so min at x = 0</text>
    <text x="40" y="300">f(0) = 11.   Answer: min = 11</text>
  </g>
  <text x="40" y="390" font-family="sans-serif" font-size="14" fill="#999">synthetic scan for a test</text>
</svg>
