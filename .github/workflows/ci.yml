name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pyyaml
      - name: Shared copies are in sync
        run: python tools/sync_shared.py --check
      - name: Unit and repo tests
        run: python -m pytest -q

  validate-plugin:
    name: claude plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate manifest and skills
        run: claude plugin validate .   # not --strict: a repo-level CLAUDE.md (for contributors) is a known warning
