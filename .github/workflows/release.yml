name: release

# Push a tag vX.Y.Z (or publish a release for it on github.com) (matching .claude-plugin/plugin.json "version") to publish a GitHub Release with
# the plugin zip and one zip per skill. INSTALL.md links to these files.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # re-run for an existing tag: Actions → release → Run workflow → pick the tag

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches the manifest version
        run: |
          v=$(python -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != plugin.json version v$v"; exit 1; }
      - name: Tests
        run: |
          python -m pip install --upgrade pip pytest pyyaml pymupdf python-docx jsonschema pint mcp httpx keyring respx
          python tools/sync_shared.py --check
          python -m pytest -q
      - name: Build zips
        run: python tools/package.py --out dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/academic-students-*.zip dist/academic-students.zip
          for f in dist/skills/*.zip; do cp "$f" "dist/skill-$(basename "$f")"; done
          files="dist/academic-students-*.zip dist/academic-students.zip dist/skill-*.zip"
          # A release published on github.com already exists when its tag push reaches us: upload into it.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes $files
          fi
