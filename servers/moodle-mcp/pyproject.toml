[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moodle-mcp"
version = "0.1.0"
description = "Read-only MCP server for Moodle Web Services: login in a terminal, token in the OS keychain, no password ever in Claude's context."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Noam Marom" }, { name = "Eyal Silbershtein" }]
dependencies = [
  "mcp>=1.2",
  "httpx>=0.27",
  "keyring>=25",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
moodle-mcp = "moodle_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/moodle_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
